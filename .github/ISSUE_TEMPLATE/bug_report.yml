name: Bug report
description: Report a reproducible problem without exposing private chat data.
title: "[bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not paste tokens, QR codes, auth.json, real chat IDs, or private messages.
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Deployment mode
      options: [macOS local, Linux cloud, hybrid, other]
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove all identifiers and credentials before pasting.
