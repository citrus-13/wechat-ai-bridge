name: Feature request
description: Propose a focused, privacy-preserving improvement.
title: "[feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Privacy and failure behavior
      description: What data leaves the device, and what should happen when identity or delivery is ambiguous?
    validations:
      required: true
